<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Groove"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>Groove</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/tomorrow-night-eighties.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/loadmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/meta.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<style>
/* ── Reset & base ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d0d0d;
  --surface:   #141414;
  --surface2:  #1a1a1a;
  --border:    #2a2a2a;
  --border2:   #333;
  --text:      #e2e2e2;
  --muted:     #555;
  --muted2:    #777;
  --green:     #3fb950;
  --red:       #f85149;
  --yellow:    #d29922;
  --blue:      #58a6ff;
  --purple:    #bc8cff;
  --cyan:      #39c5cf;
  --orange:    #f0883e;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  line-height: 1.5;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}

html {
  overscroll-behavior: none;
  height: 100%;
}

/* ── Scrollbar ─────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

/* ── Top bar ───────────────────────────────────────────── */
#topbar {
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
}

.logo-icon {
  width: 20px; height: 20px;
  color: var(--green);
  flex-shrink: 0;
}

.topbar-sep { color: var(--muted); }

#repoMeta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.repo-name {
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.branch-tag {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(88,166,255,0.08);
  border: 1px solid rgba(88,166,255,0.18);
  color: var(--blue);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}

.commit-preview {
  color: var(--muted2);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.topbar-btn {
  background: none;
  border: 1px solid var(--border2);
  color: var(--muted2);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 3px;
  transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
  white-space: nowrap;
}
.topbar-btn:hover { color: var(--text); border-color: var(--muted2); }

/* ── Connect screen ────────────────────────────────────── */
#connectScreen {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.connect-wrap {
  width: 100%;
  max-width: 500px;
}

.connect-header {
  margin-bottom: 24px;
}

.connect-header .prompt-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.ps1 { color: var(--green); font-weight: 700; }
.ps1-path { color: var(--blue); }
.ps1-cmd { color: var(--text); }
.cursor-blink {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--text);
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  margin-left: 2px;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

.connect-header p {
  color: var(--muted2);
  font-size: 12px;
  padding-left: 0;
  margin-top: 10px;
}

.section-head {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  padding: 0 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}

.project-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 240px;
  overflow-y: auto;
  margin-bottom: 20px;
}

.project-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.1s;
  border: 1px solid transparent;
}
.project-item:hover { background: var(--surface2); border-color: var(--border); }
.project-item:active { background: #1f1f1f; }

.proj-sigil { color: var(--green); width: 14px; flex-shrink: 0; }
.proj-name { color: var(--text); font-weight: 600; font-size: 13px; }
.proj-path { color: var(--muted2); font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-arrow { color: var(--muted); font-size: 12px; }

.divider-line {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 11px;
  margin: 14px 0;
}
.divider-line::before, .divider-line::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.input-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.cli-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s;
}
.cli-input:focus { border-color: var(--blue); }
.cli-input::placeholder { color: var(--muted); }

.cli-btn {
  background: var(--green);
  color: #000;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  padding: 9px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: filter 0.15s;
  white-space: nowrap;
}
.cli-btn:hover { filter: brightness(1.12); }
.cli-btn:active { filter: brightness(0.9); }
.cli-btn.secondary {
  background: none;
  border: 1px solid var(--border2);
  color: var(--muted2);
}
.cli-btn.secondary:hover { color: var(--text); border-color: var(--muted2); }

/* ── Main layout (3-panel) ─────────────────────────────── */
#mainLayout {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── Left: file tree ───────────────────────────────────── */
#filePanel {
  width: 260px;
  min-width: 180px;
  max-width: 360px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.panel-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  font-size: 11px;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.panel-tab {
  flex: 1;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 9px 8px 7px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.panel-tab:hover { color: var(--muted2); }
.panel-tab.active { color: var(--text); border-bottom-color: var(--green); }

#fileList {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  overscroll-behavior: contain;
}

.file-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  cursor: pointer;
  transition: background 0.1s;
  border-left: 2px solid transparent;
  user-select: none;
}
.file-entry:hover { background: var(--surface2); }
.file-entry.active {
  background: rgba(88,166,255,0.07);
  border-left-color: var(--blue);
}

.file-status {
  font-size: 11px;
  font-weight: 700;
  width: 14px;
  flex-shrink: 0;
  text-align: center;
}
.s-M { color: var(--yellow); }
.s-A { color: var(--green); }
.s-D { color: var(--red); }
.s-R { color: var(--blue); }
.s-Q { color: var(--muted2); }

.file-entry-name {
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.file-edit-hint {
  font-size: 10px;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.15s;
}
.file-entry:hover .file-edit-hint { opacity: 1; }

.tree-folder {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  cursor: pointer;
  color: var(--muted2);
  font-size: 12px;
  user-select: none;
  transition: background 0.1s;
}
.tree-folder:hover { background: var(--surface2); }

.folder-arrow {
  font-size: 9px;
  color: var(--muted);
  width: 10px;
  flex-shrink: 0;
}

.tree-children { border-left: 1px solid var(--border); margin-left: 18px; }

/* ── Center: diff + commit ─────────────────────────────── */
#centerPanel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── Diff view ─────────────────────────────────────────── */
#diffPanel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.diff-toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 7px 14px;
  font-size: 11px;
  color: var(--muted2);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.diff-toolbar .diff-file-label { color: var(--text); font-size: 12px; }
.diff-toolbar .diff-cmd { color: var(--muted); }

.diff-content {
  flex: 1;
  overflow: auto;
  padding: 0;
  overscroll-behavior: contain;
}

.diff-line {
  display: flex;
  align-items: stretch;
  min-width: max-content;
}
.diff-line:hover { background: rgba(255,255,255,0.015); }

.diff-line.add { background: rgba(63,185,80,0.06); }
.diff-line.add:hover { background: rgba(63,185,80,0.1); }
.diff-line.remove { background: rgba(248,81,73,0.06); }
.diff-line.remove:hover { background: rgba(248,81,73,0.1); }
.diff-line.meta { background: rgba(88,166,255,0.05); }
.diff-line.neutral { }

.diff-ln {
  width: 44px;
  padding: 0 8px;
  text-align: right;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  user-select: none;
}

.diff-sign {
  width: 18px;
  padding: 0 4px;
  text-align: center;
  font-size: 12px;
  line-height: 1.7;
  flex-shrink: 0;
}
.diff-line.add .diff-sign { color: var(--green); }
.diff-line.remove .diff-sign { color: var(--red); }
.diff-line.meta .diff-sign { color: var(--blue); }
.diff-line.neutral .diff-sign { color: transparent; }

.diff-text {
  padding: 0 14px 0 4px;
  font-size: 12px;
  line-height: 1.7;
  white-space: pre;
  flex: 1;
}
.diff-line.add .diff-text { color: #85e89d; }
.diff-line.remove .diff-text { color: #fdaeb7; }
.diff-line.meta .diff-text { color: var(--muted2); }
.diff-line.neutral .diff-text { color: var(--text); }

/* ── Commit bar ────────────────────────────────────────── */
#commitBar {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}

.commit-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.commit-ps1 { color: var(--green); font-weight: 700; font-size: 13px; white-space: nowrap; }

#commitMsg {
  flex: 1;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border2);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 4px 0;
  outline: none;
  transition: border-color 0.15s;
}
#commitMsg:focus { border-bottom-color: var(--blue); }
#commitMsg::placeholder { color: var(--muted); }

.push-btn {
  background: var(--green);
  color: #000;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 16px;
  border-radius: 3px;
  cursor: pointer;
  transition: filter 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.push-btn:hover { filter: brightness(1.12); }
.push-btn:active { filter: brightness(0.9); }
.push-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; filter: none; border: 1px solid var(--border); }

/* ── Editor panel (right) ──────────────────────────────── */
#editorPanel {
  width: 0;
  border-left: 1px solid transparent;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  transition: width 0.2s ease, border-color 0.2s;
}
#editorPanel.open {
  width: 46%;
  border-left-color: var(--border);
}

.editor-toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.editor-file-label {
  flex: 1;
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.editor-status {
  font-size: 11px;
  color: var(--muted2);
  white-space: nowrap;
}
.editor-status.unsaved { color: var(--yellow); }

.editor-btn {
  background: none;
  border: 1px solid var(--border2);
  color: var(--muted2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.editor-btn:hover { color: var(--text); border-color: var(--muted2); }
.editor-btn.save-btn { border-color: rgba(63,185,80,0.4); color: var(--green); }
.editor-btn.save-btn:hover { background: rgba(63,185,80,0.1); }
.editor-btn.close-btn { border-color: transparent; }
.editor-btn.close-btn:hover { color: var(--red); border-color: rgba(248,81,73,0.4); }

#editorCM {
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── Empty state ───────────────────────────────────────── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 8px;
  padding: 40px;
  text-align: center;
}

.empty-state .empty-icon { font-size: 28px; margin-bottom: 4px; }
.empty-state .empty-title { color: var(--muted2); font-size: 14px; font-weight: 600; }
.empty-state .empty-sub { font-size: 12px; }

/* ── Toast ─────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 12px;
  padding: 8px 18px;
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: rgba(63,185,80,0.5); color: var(--green); }
#toast.error { border-color: rgba(248,81,73,0.5); color: var(--red); }

/* ── Terminal panel ────────────────────────────────────── */
#termPanel {
  width: 380px;
  min-width: 220px;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  background: #0d0d0d;
}

#termPanel.hidden { display: none; }

#termContainer {
  flex: 1;
  overflow: hidden;
  padding: 4px;
}

/* xterm overrides */
.xterm { height: 100%; }
.xterm-viewport {
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  overflow-y: scroll !important; /* ensure xterm doesn't hide the scrollbar */
}
/* Let touch events reach the viewport for native scroll on mobile */
.xterm-screen { touch-action: pan-y; }

/* ── CodeMirror overrides ──────────────────────────────── */
.CodeMirror {
  height: 100%;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  background: var(--bg) !important;
  color: var(--text) !important;
  border: none;
}
.CodeMirror-scroll { overflow-x: auto !important; overflow-y: auto !important; }
.CodeMirror-lines { padding: 12px 0; }
.CodeMirror-line { padding: 0 16px !important; }
.CodeMirror-gutters {
  background: var(--surface) !important;
  border-right: 1px solid var(--border) !important;
}
.CodeMirror-linenumber { color: var(--muted) !important; padding: 0 8px; }
.CodeMirror-cursor { border-left: 2px solid var(--green) !important; }
.CodeMirror-selected { background: rgba(88,166,255,0.15) !important; }
.CodeMirror-focused .CodeMirror-selected { background: rgba(88,166,255,0.2) !important; }

/* ── Diff overflow fix ─────────────────────────────────── */
.diff-content { overflow-x: auto; overflow-y: auto; }
.diff-line { min-width: 0; }
.diff-text { overflow-wrap: anywhere; white-space: pre-wrap; word-break: break-all; }

/* ── Spinner ───────────────────────────────────────────── */
.spinner {
  display: inline-block;
  width: 12px; height: 12px;
  border: 1.5px solid var(--muted);
  border-top-color: var(--text);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Loading state ─────────────────────────────────────── */
.loading-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  color: var(--muted2);
  font-size: 12px;
}

/* ── Responsive: mobile stacked ────────────────────────── */
@media (max-width: 640px) {
  /* ── Base font scale down ── */
  body { font-size: 12px; }

  /* ── Topbar ── */
  #topbar { padding: 0 12px; height: 44px; gap: 8px; }
  .logo { font-size: 12px; gap: 6px; }
  .logo-icon { width: 16px; height: 16px; }
  .topbar-btn { font-size: 10px; padding: 3px 8px; }
  .repo-name { font-size: 11px; max-width: 100px; }
  .branch-tag { font-size: 10px; padding: 2px 6px; }
  .commit-preview { display: none; } /* hide on small screens */
  #topbarSep { display: none !important; }

  /* ── Connect screen ── */
  .connect-wrap { max-width: 100%; }
  .connect-header .prompt-line { font-size: 13px; }
  .connect-header p { font-size: 11px; }
  .section-head { font-size: 10px; }
  .project-item { padding: 10px 10px; }
  .proj-name { font-size: 12px; }
  .proj-path { font-size: 10px; }
  .cli-input { font-size: 12px; padding: 10px 10px; }
  .cli-btn { font-size: 11px; padding: 10px 12px; }

  /* ── Main layout: full-screen single panel with bottom nav ── */
  #mainLayout {
    flex-direction: column;
    position: relative;

<!-- Dev server open-on-phone banner -->
<div id="devBanner" style="display:none;position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:100;
  background:var(--surface2);border:1px solid rgba(63,185,80,0.5);border-radius:4px;

  box-shadow:0 4px 20px rgba(0,0,0,0.4);white-space:nowrap;">

    style="color:var(--blue);font-weight:600;text-decoration:none;border:1px solid rgba(88,166,255,0.3);
    padding:4px 10px;border-radius:3px;">open on phone ↗</a>

    style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;">✕</button>

<div id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────
let REPO = '';
let activeFile = null;
let editorDirty = false;
let allDiffLines = [];   // full parsed diff
let fileRanges = {};     // file → { start, end } indices into allDiffLines
let currentTab = 'changes';
let allTreeFiles = [];   // cached full file list

// ─── Utilities ───────────────────────────────────────────
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function showToast(msg, type = 'success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast ' + type; }, 3000);
}

// ─── Repo scanning ───────────────────────────────────────
async function loadRepos() {
  try {
    const res = await fetch('/api/repos');
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    const repos = d.repos;
    $('reposLabel').textContent = repos.length
      ? `${repos.length} repo${repos.length !== 1 ? 's' : ''} found`
      : 'no repos found';
    if (!repos.length) {
      $('projectList').innerHTML = '<div style="padding:10px 0;color:var(--muted);font-size:12px">nothing in ~/Desktop, ~/Documents, ~/dev…</div>';
      return;
    }
    $('projectList').innerHTML = repos.map(p => {
      const parts = p.split('/');
      const name = parts[parts.length - 1];
      const dir = parts.slice(0, -1).join('/') + '/';
      return `
        <div class="project-item" onclick="selectProject('${p.replace(/'/g, "\\'")}')">
          <span class="proj-sigil">▶</span>
          <span class="proj-name">${esc(name)}</span>
          <span class="proj-path">${esc(dir)}</span>
          <span class="proj-arrow">↵</span>
        </div>`;
    }).join('');
  } catch (e) {
    $('reposLabel').textContent = 'scan failed';
    $('projectList').innerHTML = '';
  }
}

function selectProject(p) {
  $('repoPathInput').value = p;
  connectRepo();
}

function showConnect() {
  $('connectScreen').style.display = 'flex';
  $('mainLayout').style.display = 'none';
  $('repoMeta').style.display = 'none';
  $('topbarSep').style.display = 'none';
  $('changeRepoBtn').style.display = 'none';
  loadRepos();
}

async function connectRepo() {
  const p = $('repoPathInput').value.trim();
  if (!p) return;
  REPO = p;
  $('connectScreen').style.display = 'none';
  $('mainLayout').style.display = 'flex';
  $('repoMeta').style.display = 'flex';
  $('topbarSep').style.display = '';
  $('changeRepoBtn').style.display = 'block';
  $('repoMeta').innerHTML = '<span class="spinner"></span>';
  $('fileList').innerHTML = '<div class="loading-row"><span class="spinner"></span> loading...</div>';
  $('termToggleBtn').style.display = 'block';
  $('termPanel').classList.add('hidden');
  initMobile();
  await Promise.all([loadRepoInfo(), loadStatus()]);
  // Reconnect terminal to new repo directory
  if (termReady && termSocket) {
    termSocket.close();
    termReady = false;
  }
}

// ─── Repo info (topbar) ──────────────────────────────────
async function loadRepoInfo() {
  try {
    const res = await fetch('/api/repo-info?repoPath=' + encodeURIComponent(REPO));
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    $('repoMeta').innerHTML = `
      <a href="${esc(d.remote)}" target="_blank" class="repo-name">${esc(d.repoName)}</a>
      <div class="branch-tag">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        ${esc(d.branch)}
      </div>
      ${d.lastCommit.subject ? `<div class="commit-preview" title="${esc(d.lastCommit.subject)}">${esc(d.lastCommit.subject)} · ${esc(d.lastCommit.time)}</div>` : ''}
    `;
  } catch (e) {
    $('repoMeta').innerHTML = `<span style="color:var(--red);font-size:12px">${esc(e.message)}</span>`;
  }
}

// ─── Git status & diff ───────────────────────────────────
function parseStatus(s) {
  if (!s) return [];
  return s.split('\n').filter(Boolean).map(line => {
    // git status --short can output:
    //   "X  filename"  (1 status char + space + filename)  e.g. "M adroiterp/..."
    //   "XY filename"  (2 status chars + space + filename) e.g. " M adroiterp/..."
    //   "?? filename"  (untracked)
    // Split on the FIRST space that is followed by a non-space (the filename start)
    const m = line.match(/^([ A-Z?!]+?) (.+)$/);
    if (!m) return null;
    const xy = m[1];
    const x = xy[0], y = xy[1] || ' ';
    const code = x !== ' ' ? x : y !== ' ' ? y : '?';
    let file = m[2];
    // Git quotes filenames with special chars
    if (file.startsWith('"') && file.endsWith('"')) {
      file = file.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    }
    // Renamed: "old -> new" — take the new name
    if (file.includes(' -> ')) {
      file = file.split(' -> ').pop();
      if (file.startsWith('"') && file.endsWith('"')) file = file.slice(1, -1);
    }
    return { code, file };
  }).filter(Boolean);
}

function parseDiff(raw) {
  if (!raw) return [];
  const lines = [];
  let oldL = 0, newL = 0;
  for (const line of raw.split('\n')) {
    if (line.startsWith('diff --git')) {
      lines.push({ type: 'file-header', text: line });
    } else if (line.startsWith('@@ ')) {
      const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) { oldL = +m[1]; newL = +m[2]; }
      lines.push({ type: 'meta', text: line, o: '', n: '' });
    } else if (line.startsWith('+') && !line.startsWith('+++')) {
      lines.push({ type: 'add', text: line, o: '', n: newL++ });
    } else if (line.startsWith('-') && !line.startsWith('---')) {
      lines.push({ type: 'remove', text: line, o: oldL++, n: '' });
    } else if (!line.startsWith('---') && !line.startsWith('+++') &&
               !line.startsWith('index ') && !line.startsWith('new file') &&
               !line.startsWith('deleted file') && !line.startsWith('Binary')) {
      lines.push({ type: 'neutral', text: line, o: oldL++, n: newL++ });
    }
  }
  return lines;
}

function buildFileRanges(diffLines) {
  const ranges = {};
  let current = null;
  let start = 0;
  for (let i = 0; i < diffLines.length; i++) {
    const l = diffLines[i];
    if (l.type === 'file-header') {
      if (current !== null) ranges[current].end = i - 1;
      // extract filename from "diff --git a/foo b/foo"
      const m = l.text.match(/diff --git a\/.+ b\/(.+)/);
      current = m ? m[1] : null;
      start = i;
      if (current) ranges[current] = { start, end: diffLines.length - 1 };
    }
  }
  return ranges;
}

async function loadStatus() {
  try {
    const res = await fetch('/api/status?repoPath=' + encodeURIComponent(REPO));
    const d = await res.json();
    if (d.error) throw new Error(d.error);

    const files = parseStatus(d.status);
    allDiffLines = parseDiff(d.diff);
    fileRanges = buildFileRanges(allDiffLines);

    $('fileCount').textContent = files.length;

    if (!files.length) {
      $('fileList').innerHTML = `
        <div class="empty-state" style="padding:30px 14px">
          <div class="empty-icon" style="font-size:20px">✓</div>
          <div class="empty-title">clean</div>
          <div class="empty-sub">nothing to commit</div>
        </div>`;
      $('pushBtn').disabled = true;
      return;
    }

    const statusClass = c => ({ M:'s-M', A:'s-A', D:'s-D', R:'s-R' }[c] || 's-Q');

    $('fileList').innerHTML = files.map(f => `
      <div class="file-entry" data-file="${esc(f.file)}" onclick="selectFile(this)">
        <span class="file-status ${statusClass(f.code)}">${f.code}</span>
        <span class="file-entry-name" title="${esc(f.file)}">${esc(f.file)}</span>
        <span class="file-edit-hint">edit</span>
      </div>`).join('');

    $('pushBtn').disabled = false;

    // show full diff by default
    renderDiff(allDiffLines, 'all changes');

  } catch (e) {
    $('fileList').innerHTML = `<div style="padding:12px;color:var(--red);font-size:12px">${esc(e.message)}</div>`;
  }
}

// ─── Diff rendering ──────────────────────────────────────
function renderDiff(lines, label) {
  $('diffToolbar').innerHTML = `
    <span class="diff-cmd">$</span>
    <span>git diff HEAD ${label === 'all changes' ? '' : '— '}</span>
    <span class="diff-file-label">${esc(label)}</span>
  `;

  if (!lines.length) {
    $('diffContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">▒</div>
        <div class="empty-title">no diff for this file</div>
        <div class="empty-sub">file may be untracked or binary</div>
      </div>`;
    return;
  }

  const filtered = lines.filter(l => l.type !== 'file-header');

  $('diffContent').innerHTML = filtered.map(l => `
    <div class="diff-line ${l.type}">
      <div class="diff-ln">${l.o !== '' ? l.o : ''}</div>
      <div class="diff-ln">${l.n !== '' ? l.n : ''}</div>
      <div class="diff-sign">${l.type === 'add' ? '+' : l.type === 'remove' ? '-' : l.type === 'meta' ? '↕' : ''}</div>
      <div class="diff-text">${esc(l.text)}</div>
    </div>`).join('');
}

// ─── File selection ──────────────────────────────────────
function selectFile(el) {
  const file = el.dataset.file;
  if (!file) return;

  // Update active highlight
  document.querySelectorAll('.file-entry').forEach(e => e.classList.remove('active'));
  el.classList.add('active');

  activeFile = file;

  // Show file-specific diff
  const range = fileRanges[file];
  if (range) {
    renderDiff(allDiffLines.slice(range.start, range.end + 1), file);
  } else {
    renderDiff([], file);
  }

  // On mobile: go to diff tab first, editor opens separately via nav
  if (isMobile()) {
    mobileTab('diff');
  }

  // Open editor with file contents
  openEditor(file);
}

// ─── Editor (CodeMirror) ─────────────────────────────────
let cmEditor = null;

CodeMirror.modeURL = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/%N/%N.min.js';

function getMode(filename) {
  const info = CodeMirror.findModeByFileName(filename);
  return info ? info.mode : 'null';
}

function initCM() {
  if (cmEditor) return;
  cmEditor = CodeMirror($('editorCM'), {
    value: '',
    theme: 'tomorrow-night-eighties',
    lineNumbers: true,
    lineWrapping: true,        // ← no horizontal scroll
    tabSize: 2,
    indentWithTabs: false,
    autofocus: false,
    extraKeys: {
      'Ctrl-S': () => saveFile(),
      'Cmd-S':  () => saveFile(),
      Tab: cm => cm.replaceSelection('  '),
    },
  });
  cmEditor.on('change', () => {
    if (!editorDirty) {
      editorDirty = true;
      $('editorStatus').textContent = 'unsaved';
      $('editorStatus').className = 'editor-status unsaved';
    }
  });
}

async function openEditor(file) {
  initCM();
  const panel = $('editorPanel');
  $('editorFilename').textContent = file;
  $('editorStatus').textContent = 'loading...';
  $('editorStatus').className = 'editor-status';
  cmEditor.setValue('');
  panel.classList.add('open');
  editorDirty = false;

  // Set syntax mode from filename
  const mode = getMode(file);
  CodeMirror.autoLoadMode(cmEditor, mode);
  cmEditor.setOption('mode', mode);

  try {
    const res = await fetch(`/api/file-read?repoPath=${encodeURIComponent(REPO)}&file=${encodeURIComponent(file)}`);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    cmEditor.setValue(d.content);
    cmEditor.clearHistory();
    $('editorStatus').textContent = 'saved';
    $('editorStatus').className = 'editor-status';
    editorDirty = false;
    // On mobile, switch to editor tab
    if (isMobile()) mobileTab('editor');
    // Refresh editor layout after panel opens
    setTimeout(() => cmEditor.refresh(), 50);
  } catch (e) {
    cmEditor.setValue(`# error loading file\n# ${e.message}`);
    $('editorStatus').textContent = 'error';
    $('editorStatus').className = 'editor-status';
  }
}

function closeEditor() {
  if (editorDirty && !confirm('You have unsaved changes. Close anyway?')) return;
  $('editorPanel').classList.remove('open');
  activeFile = null;
  editorDirty = false;
  document.querySelectorAll('.file-entry').forEach(e => e.classList.remove('active'));
}

async function saveFile() {
  if (!activeFile || !cmEditor) return;
  const content = cmEditor.getValue();
  $('editorStatus').textContent = 'saving...';
  $('editorStatus').className = 'editor-status';
  try {
    const res = await fetch('/api/file-write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repoPath: REPO, file: activeFile, content })
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    editorDirty = false;
    $('editorStatus').textContent = 'saved';
    $('editorStatus').className = 'editor-status';
    showToast(`saved ${activeFile}`);
    await loadStatus();
    const entry = document.querySelector(`.file-entry[data-file="${CSS.escape(activeFile)}"]`);
    if (entry) entry.classList.add('active');
  } catch (e) {
    $('editorStatus').textContent = 'save failed';
    $('editorStatus').className = 'editor-status unsaved';
    showToast(e.message, 'error');
  }
}

// ─── Push ────────────────────────────────────────────────
// ─── Tab switching ───────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  $('tabChanges').classList.toggle('active', tab === 'changes');
  $('tabAll').classList.toggle('active', tab === 'all');
  $('treeSearch').style.display = tab === 'all' ? 'block' : 'none';
  if (tab === 'all') {
    if (allTreeFiles.length) {
      renderTree(allTreeFiles);
    } else {
      loadFileTree();
    }
  } else {
    loadStatus();
  }
}

// ─── Full file tree ──────────────────────────────────────
async function loadFileTree() {
  $('fileList').innerHTML = '<div class="loading-row"><span class="spinner"></span> loading files...</div>';
  try {
    const res = await fetch('/api/file-tree?repoPath=' + encodeURIComponent(REPO));
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    allTreeFiles = d.files;
    renderTree(allTreeFiles);
    // wire up search
    const input = $('treeSearchInput');
    input.value = '';
    input.oninput = () => {
      const q = input.value.trim().toLowerCase();
      renderTree(q ? allTreeFiles.filter(f => f.toLowerCase().includes(q)) : allTreeFiles);
    };
  } catch (e) {
    $('fileList').innerHTML = `<div style="padding:12px;color:var(--red);font-size:12px">${esc(e.message)}</div>`;
  }
}

function renderTree(files) {
  if (!files.length) {
    $('fileList').innerHTML = '<div style="padding:12px;color:var(--muted);font-size:12px">no files match</div>';
    return;
  }

  // Build a folder tree structure
  const tree = {};
  for (const f of files) {
    const parts = f.split('/');
    let node = tree;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node[parts[i]]) node[parts[i]] = {};
      node = node[parts[i]];
    }
    node[parts[parts.length - 1]] = null; // null = file leaf
  }

  function renderNode(node, prefix, depth) {
    let html = '';
    const entries = Object.entries(node).sort(([a, av], [b, bv]) => {
      // dirs first, then files
      const aDir = av !== null, bDir = bv !== null;
      if (aDir !== bDir) return aDir ? -1 : 1;
      return a.localeCompare(b);
    });
    for (const [name, child] of entries) {
      const fullPath = prefix ? `${prefix}/${name}` : name;
      if (child === null) {
        // file
        const ext = name.includes('.') ? name.split('.').pop() : '';
        html += `
          <div class="file-entry tree-file" data-file="${esc(fullPath)}" onclick="selectFile(this)" style="padding-left:${12 + depth * 14}px">
            <span class="file-status" style="color:var(--muted);font-size:10px">·</span>
            <span class="file-entry-name" title="${esc(fullPath)}">${esc(name)}</span>
            <span class="file-edit-hint">edit</span>
          </div>`;
      } else {
        // folder — collapsible
        const folderId = 'fold-' + CSS.escape(fullPath);
        html += `
          <div class="tree-folder" onclick="toggleFolder('${esc(fullPath)}')" style="padding-left:${12 + depth * 14}px">
            <span class="folder-arrow" id="arr-${folderId}">▶</span>
            <span style="color:var(--muted2)">${esc(name)}/</span>
          </div>
          <div class="tree-children" id="${folderId}" style="display:none">
            ${renderNode(child, fullPath, depth + 1)}
          </div>`;
      }
    }
    return html;
  }

  $('fileList').innerHTML = renderNode(tree, '', 0);
}

function toggleFolder(path) {
  const folderId = 'fold-' + CSS.escape(path);
  const el = document.getElementById(folderId);
  const arr = document.getElementById('arr-' + folderId);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (arr) arr.textContent = open ? '▶' : '▼';
}

async function doPush() {
  const msg = $('commitMsg').value.trim();
  if (!msg) { showToast('enter a commit message', 'error'); $('commitMsg').focus(); return; }

  const btn = $('pushBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> pushing...';

  try {
    const res = await fetch('/api/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, repoPath: REPO })
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    $('commitMsg').value = '';
    showToast('pushed ✓');
    closeEditor();
    $('fileList').innerHTML = '<div class="loading-row"><span class="spinner"></span> refreshing...</div>';
    await Promise.all([loadRepoInfo(), loadStatus()]);
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '↑ push';
  }
}

// ─── Mobile nav ──────────────────────────────────────────
const isMobile = () => window.innerWidth <= 640;

let currentMobileTab = 'files';

function mobileTab(tab) {
  if (!isMobile()) return;
  currentMobileTab = tab;

  // Reset all nav buttons
  document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove('active'));
  const btnMap = { files: 'mnFiles', diff: 'mnDiff', editor: 'mnEditor', push: 'mnPush', term: 'mnTerm' };
  const activeBtn = $(btnMap[tab]);
  if (activeBtn) activeBtn.classList.add('active');

  // Hide all panels
  ['filePanel', 'centerPanel', 'editorPanel', 'termPanel'].forEach(id => {
    $(id).classList.remove('mobile-active');
  });

  // Always restore defaults before switching
  $('diffPanel').style.display = 'flex';
  $('diffPanel').style.flex = '1';
  $('commitBar').style.display = 'none';

  if (tab === 'files') {
    $('filePanel').classList.add('mobile-active');

  } else if (tab === 'diff') {
    $('centerPanel').classList.add('mobile-active');
    $('diffPanel').style.display = 'flex';
    $('diffPanel').style.flex = '1';
    $('commitBar').style.display = 'none';

  } else if (tab === 'editor') {
    $('editorPanel').classList.add('mobile-active');
    if (cmEditor) setTimeout(() => cmEditor.refresh(), 50);

  } else if (tab === 'push') {
    $('centerPanel').classList.add('mobile-active');
    $('diffPanel').style.display = 'none';
    $('commitBar').style.display = 'flex';
    setTimeout(() => $('commitMsg').focus(), 100);

  } else if (tab === 'term') {
    $('termPanel').classList.add('mobile-active');
    // Init terminal on first open, reconnect if repo changed
    if (!termReady) {
      initTerm();
    } else {
      setTimeout(() => { fitAddon && fitAddon.fit(); sendResize(); }, 50);
    }
  }
}

function initMobile() {
  if (!isMobile()) return;
  $('filePanel').classList.add('mobile-active');
  $('centerPanel').classList.remove('mobile-active');
  $('editorPanel').classList.remove('mobile-active');
  currentMobileTab = 'files';
}

// When a file is selected on mobile, auto-switch to diff tab
const _origSelectFile = window.selectFile;

// ─── Terminal ────────────────────────────────────────────
let term = null;
let termSocket = null;
let fitAddon = null;
let termReady = false;
let tailscaleIP = null;

// Fetch Tailscale IP once on load
fetch('/api/tailscale-ip').then(r => r.json()).then(d => { tailscaleIP = d.ip; }).catch(() => {});

// Detect dev server URLs in terminal output
// Matches output from Vite, Next.js, CRA, etc.
// e.g. "Local:   http://localhost:3001"
//      "On Your Network: http://192.168.x.x:5173"
//      "localhost:8080"
const DEV_URL_RE = /https?:\/\/(?:localhost|127\.0\.0\.1):(\d{2,5})/i;

// Buffer partial terminal lines across chunks
let termLineBuf = '';

function checkTermOutputForDevServer(data) {
  if (!tailscaleIP) return;

  // Strip ANSI escape codes for clean matching
  const clean = data.replace(/\x1b\[[0-9;]*[mGKHFABCDJsu]/g, '').replace(/\r/g, '');
  termLineBuf += clean;

  // Process complete lines
  const lines = termLineBuf.split('\n');
  termLineBuf = lines.pop(); // keep incomplete last chunk

  for (const line of lines) {
    const m = line.match(DEV_URL_RE);
    if (!m) continue;
    const port = m[1];
    if (port === '9000') continue; // skip Groove's own port
    const url = `http://${tailscaleIP}:${port}`;
    const banner = $('devBanner');
    $('devBannerLink').href = url;
    $('devBannerLink').textContent = `open on phone ↗  ${url}`;
    banner.style.display = 'flex';
    clearTimeout(banner._timer);
    banner._timer = setTimeout(() => { banner.style.display = 'none'; }, 30000);
    break; // show banner for first match only
  }
}

function initTerm() {
  if (termReady) return;
  termReady = true;

  term = new Terminal({
    theme: {
      background: '#0d0d0d',
      foreground: '#e2e2e2',
      cursor:     '#3fb950',
      black:      '#0d0d0d',
      red:        '#f85149',
      green:      '#3fb950',
      yellow:     '#d29922',
      blue:       '#58a6ff',
      magenta:    '#bc8cff',
      cyan:       '#39c5cf',
      white:      '#e2e2e2',
      brightBlack: '#555',
      brightGreen: '#56d364',
      brightBlue:  '#79c0ff',
    },
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 13,
    lineHeight: 1.5,
    cursorBlink: true,
    scrollback: 5000,
    scrollSensitivity: 5,
    fastScrollSensitivity: 20,
    fastScrollModifier: 'shift',
    allowTransparency: false,
  });

  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open($('termContainer'));
  fitAddon.fit();

  // xterm eats all touch events — intercept at capture phase before it does
  setTimeout(() => {
    const container = $('termContainer');
    let touchStartY = 0;
    let scrolling = false;

    container.addEventListener('touchstart', e => {
      touchStartY = e.touches[0].clientY;
      scrolling = false;
    }, { passive: true, capture: true });

    container.addEventListener('touchmove', e => {
      const viewport = container.querySelector('.xterm-viewport');
      if (!viewport) return;
      const dy = touchStartY - e.touches[0].clientY;
      touchStartY = e.touches[0].clientY;
      // Only scroll if there's actually scrollable content
      if (Math.abs(dy) > 2) {
        viewport.scrollTop += dy;
        scrolling = true;
      }
    }, { passive: true, capture: true });
  }, 100);

  connectTermSocket();

  term.onData(data => {
    if (termSocket && termSocket.readyState === WebSocket.OPEN) {
      termSocket.send(JSON.stringify({ type: 'input', data }));
    }
  });

  window.addEventListener('resize', () => {
    if (term && fitAddon) {
      fitAddon.fit();
      sendResize();
    }
  });
}

function connectTermSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/terminal?repoPath=${encodeURIComponent(REPO || '')}`;
  termSocket = new WebSocket(url);

  termSocket.onopen = () => {
    sendResize();
    term.write('\r\n\x1b[32m# groove terminal\x1b[0m\r\n');
  };

  termSocket.onmessage = e => {
    term.write(e.data);
    checkTermOutputForDevServer(e.data);
  };

  termSocket.onclose = () => {
    term.write('\r\n\x1b[33m[disconnected]\x1b[0m\r\n');
    termReady = false;
  };

  termSocket.onerror = () => {
    term.write('\r\n\x1b[31m[connection error]\x1b[0m\r\n');
  };
}

function sendResize() {
  if (termSocket && termSocket.readyState === WebSocket.OPEN && term) {
    termSocket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }
}

function clearTerm() {
  if (term) term.clear();
}

function killTerm() {
  if (termSocket && termSocket.readyState === WebSocket.OPEN) {
    // Send Ctrl+C to stop any running process
    termSocket.send(JSON.stringify({ type: 'input', data: '\x03' }));
    setTimeout(() => {
      termSocket.close();
      termReady = false;
      if (term) term.write('\r\n\x1b[33m[session killed — tap term tab to reconnect]\x1b[0m\r\n');
    }, 200);
  }
}

function toggleTerm() {
  const panel = $('termPanel');
  const nowHidden = panel.classList.toggle('hidden');
  $('termToggleBtn').style.color = nowHidden ? '' : 'var(--green)';
  if (!nowHidden) {
    if (!termReady) initTerm();
    else setTimeout(() => { fitAddon && fitAddon.fit(); sendResize(); }, 50);
  }
}

// ─── Boot ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  loadRepos();
  $('repoPathInput').addEventListener('keydown', e => { if (e.key === 'Enter') connectRepo(); });
  $('commitMsg').addEventListener('keydown', e => { if (e.key === 'Enter') doPush(); });
  initMobile();
  window.addEventListener('resize', initMobile);
});
